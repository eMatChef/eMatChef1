security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            id: App\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        
        refresh:
            pattern: ^/api/token/refresh
            stateless: true
            provider: app_user_provider
            refresh_jwt:
                check_path: /api/token/refresh
        
        logout:
            pattern: ^/api/auth/logout
            stateless: true
            security: false
        
        login:
            pattern: ^/api/auth/login_check
            stateless: true
            json_login:
                check_path: /api/auth/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
        
        # Public API (QR-Lookup etc.): darf niemals durch JWT-Authenticator scheitern,
        # auch wenn Clients fälschlicherweise einen (ungültigen) Authorization-Header mitschicken.
        api_public:
            pattern: ^/api/public
            stateless: true
            security: false

        # Uptime / Better Stack: kein JWT (Monitore senden keinen Token).
        api_health:
            pattern: ^/api/health
            stateless: true
            security: false

        # robots.txt + API-Root: öffentlich, explizit noindex (Search Console Domain-Property).
        api_discovery:
            pattern: ^/($|robots\.txt$)
            stateless: true
            security: false
        
        api:
            pattern: ^/(api|media)
            stateless: true
            jwt: ~

    access_control:
        - { path: ^/api/auth/login_check, roles: PUBLIC_ACCESS }
        # Session-Check liefert 401 JSON ohne Login — darf nicht hinter ROLE_USER haengen (sonst CORS/Preflight wirkt „kaputt“ im Browser).
        - { path: ^/api/auth/session, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/verify, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/resend-verification, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/password-reset/request, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/password-reset/confirm, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/logout, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/public, roles: PUBLIC_ACCESS }
        - { path: ^/api/health, roles: PUBLIC_ACCESS }
        - { path: ^/robots\.txt$, roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        # CORS-Preflight (OPTIONS) muss Security passieren, bevor Nelmio antwortet — sonst fehlen Access-Control-* Header.
        - { path: ^/api, roles: PUBLIC_ACCESS, methods: [OPTIONS] }
        - { path: ^/media, roles: PUBLIC_ACCESS, methods: [OPTIONS] }
        - { path: .*, roles: [ROLE_USER] }
