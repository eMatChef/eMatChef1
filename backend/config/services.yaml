parameters:
    # Optional: sichtbarer From-Absender (fällt in MailOutboundSettingsStore auf noreply@localhost, wenn leer/ungueltig).
    env(MAILER_FROM): 'noreply@ematchef.ch'
    # Optional: Reply-To für System-Mails (wenn gesetzt und gültige E-Mail). Sonst optional in mail_outbound.json.
    env(MAILER_REPLY_TO): ''
    # Optional: Basis-URL für öffentliche QR-Links (/i/m/, /i/b/). Leer = APP_FRONTEND_URL (z. B. nur eine Domain).
    env(APP_PUBLIC_QR_URL): ''
    # Optional: Fallback für fcal API-Key (Schulferien); bevorzugt zentral in var/app/integration_settings.json (Superadmin).
    env(FCAL_API_KEY): ''
    # 1 = Turnstile bei Registrierung nicht prüfen (nur lokal/Test; Produktion nie)
    env(TURNSTILE_SKIP_VERIFY): '0'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Security\UserProvider:
        arguments:
            $userRepository: '@App\Repository\UserRepository'
            $profileRepository: '@App\Repository\ProfileRepository'

    App\EventListener\IdGeneratorSubscriber:
        tags:
            - { name: doctrine.event_subscriber }

    App\Service\TurnstileVerifier:
        arguments:
            $secretKey: '%env(TURNSTILE_SECRET_KEY)%'
            $skipVerify: '%env(bool:TURNSTILE_SKIP_VERIFY)%'

