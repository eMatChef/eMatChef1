parameters:
    # Optional: sichtbarer From-Absender (fällt in MailOutboundSettingsStore auf noreply@localhost, wenn leer/ungueltig).
    env(MAILER_FROM): 'noreply@ematchef.ch'
    # Optional: Reply-To für System-Mails (wenn gesetzt und gültige E-Mail). Sonst optional in mail_outbound.json.
    env(MAILER_REPLY_TO): ''
    # Optional: Basis-URL für öffentliche QR-Links (/i/m/…/b/…, /i/a/, /i/w/, /i/c/). Leer = APP_FRONTEND_URL.
    env(APP_PUBLIC_QR_URL): ''
    # Optional: Fallback für fcal API-Key (Schulferien); bevorzugt zentral in var/app/integration_settings.json (Superadmin).
    env(FCAL_API_KEY): ''
    # 1 = Turnstile bei Registrierung nicht prüfen (nur lokal/Test; Produktion nie)
    env(TURNSTILE_SKIP_VERIFY): '0'
    # 1 = Dev-Tools auf Develop-Droplet (DB-Reset etc.) trotz APP_ENV=prod
    env(EMATCHEF_DEV_TOOLS): '0'
    env(GOOGLE_OAUTH_CLIENT_ID): ''
    env(GOOGLE_OAUTH_CLIENT_SECRET): ''
    env(GOOGLE_OAUTH_REDIRECT_URI): ''
    env(GOOGLE_GMAIL_REDIRECT_URI): ''
    # Sprachen: de|fr|it|en|ch-rm = Hauptsprachen; de|fr|it × pfadi|cevi|jubla = Org-Deltas — siehe docs/TRANSLATION.md
    app.supported_languages: ['de', 'de-pfadi', 'de-cevi', 'de-jubla', 'en', 'fr', 'fr-pfadi', 'fr-cevi', 'fr-jubla', 'it', 'it-pfadi', 'it-cevi', 'it-jubla', 'ch-rm']
    app.default_language: 'de'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Security\UserProvider:
        arguments:
            $userRepository: '@App\Repository\UserRepository'
            $profileRepository: '@App\Repository\ProfileRepository'

    App\EventListener\IdGeneratorSubscriber:
        tags:
            - { name: doctrine.event_subscriber }

    App\Service\TurnstileVerifier:
        arguments:
            $secretKey: '%env(TURNSTILE_SECRET_KEY)%'
            $skipVerify: '%env(bool:TURNSTILE_SKIP_VERIFY)%'

    App\Config\LanguageConfig:
        arguments:
            $supportedLanguages: '%app.supported_languages%'
            $defaultLanguage: '%app.default_language%'

