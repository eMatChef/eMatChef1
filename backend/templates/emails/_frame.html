<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
  </head>
  <body style="margin:0;padding:0;background:#f0fdf4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0f172a;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{{preheader}}</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f0fdf4;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:20px;overflow:hidden;border:1px solid #d1fae5;box-shadow:0 12px 40px rgba(6, 95, 70, 0.08);">
            <tr>
              <td style="height:5px;line-height:5px;font-size:0;background:{{accent}};">&nbsp;</td>
            </tr>
            <tr>
              <td style="padding:28px 32px 8px 32px;">
                {{brand_header_html}}
              </td>
            </tr>
            <tr>
              <td style="padding:12px 32px 32px 32px;">
                {{body_html}}
              </td>
            </tr>
          </table>
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;">
            <tr>
              <td style="padding:20px 8px 8px 8px;text-align:center;font-size:12px;line-height:1.6;color:#64748b;">
                {{footer_note}}
              </td>
            </tr>
            <tr>
              <td style="padding:0 8px 12px 8px;text-align:center;font-size:12px;font-weight:700;letter-spacing:0.02em;color:#059669;">
                eMatChef
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
