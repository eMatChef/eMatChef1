<p style="margin:0 0 6px 0;font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#be123c;">Sicherheit</p>
<h1 style="margin:0 0 20px 0;font-size:26px;line-height:1.25;font-weight:800;letter-spacing:-0.03em;color:#0f172a;">{{headline}}</h1>
<p style="margin:0 0 16px 0;font-size:16px;line-height:1.55;color:#1e293b;">{{greeting_word}} {{display_name}},</p>
<p style="margin:0 0 20px 0;font-size:16px;line-height:1.55;color:#334155;">{{intro}}</p>
<p style="margin:0 0 8px 0;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#94a3b8;">{{code_label}}</p>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:0 0 24px 0;">
  <tr>
    <td align="center" style="padding:18px;background:#fff1f2;border-radius:14px;border:1px solid #fecdd3;">
      <p style="margin:0;font-size:32px;line-height:1.1;letter-spacing:0.28em;font-weight:800;color:#9f1239;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">{{reset_code}}</p>
    </td>
  </tr>
</table>
<p style="margin:0 0 18px 0;">
  <a href="{{reset_url}}" style="display:inline-block;padding:14px 26px;background:#e11d48;color:#ffffff;text-decoration:none;border-radius:999px;font-weight:700;font-size:15px;">
    {{cta_label}}
  </a>
</p>
<p style="margin:0 0 6px 0;font-size:12px;line-height:1.5;color:#94a3b8;">{{link_hint}}</p>
<p style="margin:0 0 18px 0;font-size:12px;line-height:1.5;word-break:break-all;">
  <a href="{{reset_url}}" style="color:#e11d48;text-decoration:none;">{{reset_url}}</a>
</p>
<p style="margin:0 0 12px 0;font-size:14px;line-height:1.5;color:#64748b;">{{expires_intro}} <strong style="color:#0f172a;">{{expires_at}}</strong></p>
<p style="margin:0;font-size:14px;line-height:1.55;color:#475569;">{{instruction}}</p>
