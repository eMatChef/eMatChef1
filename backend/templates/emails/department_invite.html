<p style="margin:0 0 6px 0;font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#059669;">{{banner_title}}</p>
<h1 style="margin:0 0 20px 0;font-size:26px;line-height:1.25;font-weight:800;letter-spacing:-0.03em;color:#064e3b;">{{department_name}}</h1>
<p style="margin:0 0 16px 0;font-size:16px;line-height:1.55;color:#1e293b;">{{greeting_word}} {{recipient_name}},</p>
{{invite_lead_html}}
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:0 0 24px 0;">
  <tr>
    <td style="padding:16px 18px;background:#ecfdf5;border-radius:14px;border:1px solid #a7f3d0;">
      {{role_line_html}}
      <p style="margin:0;font-size:14px;line-height:1.5;color:#065f46;">{{password_hint}}</p>
    </td>
  </tr>
</table>
<p style="margin:0 0 18px 0;">
  <a href="{{invite_url}}" style="display:inline-block;padding:14px 26px;background:#10b981;color:#ffffff;text-decoration:none;border-radius:999px;font-weight:700;font-size:15px;letter-spacing:-0.01em;">
    {{cta_label}}
  </a>
</p>
<p style="margin:0 0 6px 0;font-size:12px;line-height:1.5;color:#94a3b8;">{{link_hint}}</p>
<p style="margin:0;font-size:12px;line-height:1.5;word-break:break-all;">
  <a href="{{invite_url}}" style="color:#059669;text-decoration:none;">{{invite_url}}</a>
</p>
