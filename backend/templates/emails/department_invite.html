<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,sans-serif;color:#111827;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:620px;background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
            <tr>
              <td align="center" style="padding:20px 22px 8px 22px;">
                {{brand_header_html}}
              </td>
            </tr>
            <tr>
              <td style="padding:18px 22px;background:#1d4ed8;color:#ffffff;font-size:18px;font-weight:700;">
                {{banner_title}}
              </td>
            </tr>
            <tr>
              <td style="padding:22px;">
                <p style="margin:0 0 12px 0;font-size:15px;line-height:1.5;">{{greeting_word}} {{recipient_name}},</p>
                {{invite_lead_html}}
                {{role_line_html}}
                <p style="margin:0 0 20px 0;">
                  <a href="{{invite_url}}" style="display:inline-block;padding:11px 16px;background:#16a34a;color:#ffffff;text-decoration:none;border-radius:8px;font-weight:700;">
                    {{cta_label}}
                  </a>
                </p>
                <p style="margin:0 0 8px 0;font-size:13px;color:#6b7280;">{{link_hint}}</p>
                <p style="margin:0 0 14px 0;font-size:13px;word-break:break-all;">
                  <a href="{{invite_url}}" style="color:#1d4ed8;text-decoration:underline;">{{invite_url}}</a>
                </p>
                <p style="margin:0;font-size:12px;color:#9ca3af;">{{footer_note}}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
