# Dependabot: Dependencies und Actions aktuell halten
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    target-branch: develop
    labels:
      - dependencies
      - frontend
    groups:
      frontend-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    target-branch: develop
    labels:
      - dependencies
      - backend
    groups:
      backend-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    target-branch: develop
    labels:
      - dependencies
      - github-actions
