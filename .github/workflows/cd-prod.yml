name: CD Prod

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Deploy to production server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            # Droplet → GitHub Deploy-Key (nicht PROD_SSH_KEY). non-login-SSH: kein $HOME verlassen.
            # Primär: /root/.ssh/ematchef_deploy_prod_ed25519 (Hetzner Prod); Fallback: Alias-Pfad aus Doku.
            GIT_DEPLOY_KEY=""
            for candidate in \
              /root/.ssh/ematchef_deploy_prod_ed25519 \
              /home/deploy-prod/.ssh/ematchef_deploy_ed25519 \
              /root/.ssh/ematchef_deploy_ed25519
            do
              if [[ -e "$candidate" ]]; then
                GIT_DEPLOY_KEY="$candidate"
                break
              fi
            done
            if [[ -z "$GIT_DEPLOY_KEY" ]]; then
              echo "::error::Kein Deploy-Key gefunden (ematchef_deploy_prod_ed25519 o.ä.) — siehe deploy/SERVER-UPDATE.md 6b"
              exit 1
            fi
            echo "Using git deploy key: $GIT_DEPLOY_KEY"
            export EMATCHEF_GIT_SSH_IDENTITY="$GIT_DEPLOY_KEY"
            export GIT_SSH_COMMAND="ssh -i ${GIT_DEPLOY_KEY} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            cd "${{ secrets.PROD_DEPLOY_PATH }}"
            DEPLOY_ROOT="${{ secrets.PROD_DEPLOY_PATH }}"
            if [[ ! -w "${DEPLOY_ROOT}/.git/objects" ]]; then
              chown -R "$(id -u):$(id -g)" "${DEPLOY_ROOT}/.git" 2>/dev/null || \
              docker run --rm -u 0 -v "${DEPLOY_ROOT}/.git:/git" alpine:3.20 \
                sh -c "chown -R $(id -u):$(id -g) /git && chmod -R u+rwX /git"
            fi
            git fetch --no-tags origin "+refs/heads/prod:refs/remotes/origin/prod"
            git reset --hard origin/prod
            EMATCHEF_PROD_ROOT="${{ secrets.PROD_DEPLOY_PATH }}" \
            EMATCHEF_GIT_BRANCH=prod \
            COMPOSE_PROJECT_NAME=ematchef-prod \
            ./deploy/prod-update.sh reset
