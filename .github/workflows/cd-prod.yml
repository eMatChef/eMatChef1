name: CD Prod

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Deploy to production server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            # Fester Pfad (kein $HOME): non-login-SSH von Actions setzt HOME oft nicht; ${{ secrets.PROD_SSH_USER }} kann in Org/Env leer sein.
            # SSH-Login-User bleibt secrets.PROD_SSH_USER — dieser Block betrifft nur den GitHub-Repo-Deploy-Key auf dem Server.
            GIT_DEPLOY_KEY="/home/deploy-prod/.ssh/ematchef_deploy_ed25519"
            test -f "$GIT_DEPLOY_KEY" || { echo "::error::Datei fehlt (git fetch): $GIT_DEPLOY_KEY — auf dem Droplet anlegen (siehe deploy/SERVER-UPDATE.md 6b)"; exit 1; }
            export EMATCHEF_GIT_SSH_IDENTITY="$GIT_DEPLOY_KEY"
            export GIT_SSH_COMMAND="ssh -i ${GIT_DEPLOY_KEY} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            cd "${{ secrets.PROD_DEPLOY_PATH }}"
            DEPLOY_ROOT="${{ secrets.PROD_DEPLOY_PATH }}"
            uid="$(id -u)"
            gid="$(id -g)"
            # Immer Docker: Skript liegt auf dem Server oft noch nicht (fetch scheiterte zuvor).
            echo "==> .git-Rechte per Docker auf ${uid}:${gid} …"
            docker run --rm -u 0 -v "${DEPLOY_ROOT}/.git:/git" alpine:3.20 \
              sh -c "chown -R ${uid}:${gid} /git && chmod -R u+rwX /git"
            git fetch --no-tags origin "+refs/heads/prod:refs/remotes/origin/prod"
            git reset --hard origin/prod
            EMATCHEF_PROD_ROOT="${{ secrets.PROD_DEPLOY_PATH }}" \
            EMATCHEF_GIT_BRANCH=prod \
            COMPOSE_PROJECT_NAME=ematchef-prod \
            ./deploy/prod-update.sh reset
