name: Deploy Frontend Staging (Droplet)

# App/QR/Devices auf dem Staging-Webroot (Develop-Droplet).
# API: api.staging.ematchef.ch — Marketing bleibt Prod/Hostpoint.

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-frontend-staging
  cancel-in-progress: true

jobs:
  deploy-frontend-staging:
    name: Build and rsync app to staging webroot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build droplet frontend (staging)
        working-directory: ${{ github.workspace }}
        env:
          EMATCHEF_REPO_ROOT: ${{ github.workspace }}
        run: bash scripts/build-droplet-frontend.sh staging

      - name: Verify output
        run: |
          test -f deploy/droplet/staging/app/index.html
          du -sh deploy/droplet/staging/app

      - name: Rsync app to droplet
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches: -avz --delete
          path: deploy/droplet/staging/app/
          remote_path: ${{ secrets.STAGING_APP_WEBROOT }}/
          remote_host: ${{ secrets.DEVELOP_SSH_HOST }}
          remote_user: ${{ secrets.DEVELOP_SSH_USER }}
          remote_key: ${{ secrets.DEVELOP_SSH_KEY }}
          remote_port: ${{ secrets.DEVELOP_SSH_PORT }}
