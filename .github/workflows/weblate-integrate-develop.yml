# Weblate → develop (Auto-Sync)

# Wenn Weblate auf Branch `weblate` pusht: Locale-Dateien nach `develop` übernehmen.
# Nur `frontend/src/locales/**` — kein Blind-Merge des ganzen weblate-Branches.
# Direct push auf develop ist durch Branch-Protection blockiert → PR + Auto-Merge.

name: Weblate integrate develop

on:
  push:
    branches:
      - weblate
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weblate-integrate-develop
  cancel-in-progress: false

jobs:
  sync-locales:
    name: Locales weblate → develop
    runs-on: ubuntu-latest
    # Kein Loop: dieser Job pusht nur chore/weblate-locales, nie weblate
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/weblate'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync locale files from weblate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "Matthias Ruffieux"
          # Gleiche E-Mail wie gwaagg → kein zusätzlicher Bot in Contributors
          git config user.email "matthias.ruffieux@gmail.com"

          BRANCH="chore/weblate-locales"

          git fetch origin weblate develop
          git reset --hard origin/develop

          # Nur Locale-JSON aus weblate übernehmen
          git checkout origin/weblate -- frontend/src/locales/

          # Orphan-/Doppel-Präfix-Müll nie mergen
          git rm -f --ignore-unmatch \
            frontend/src/locales/en-US.json \
            frontend/src/locales/en-US-*.json \
            frontend/src/locales/fr-FR.json \
            frontend/src/locales/fr-FR-*.json \
            frontend/src/locales/it-IT.json \
            frontend/src/locales/it-IT-*.json \
            frontend/src/locales/de-de-*.json \
            frontend/src/locales/fr-fr-*.json \
            frontend/src/locales/it-it-*.json \
            2>/dev/null || true

          git add frontend/src/locales/

          # Sicherheit: nur unter locales/
          BAD="$(git diff --cached --name-only | grep -v '^frontend/src/locales/' || true)"
          if [[ -n "$BAD" ]]; then
            echo "::error::Unerlaubte Dateien im Staging:"
            echo "$BAD"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Keine Locale-Änderungen — fertig."
            exit 0
          fi

          echo "Geänderte Dateien:"
          git diff --cached --stat

          git commit -m "chore(l10n): Weblate → develop"

          git push -f origin "HEAD:refs/heads/${BRANCH}"

          # PR öffnen oder vorhandene Nummer holen
          PR="$(gh pr list --base develop --head "${BRANCH}" --json number --jq '.[0].number // empty')"
          if [[ -z "$PR" ]]; then
            PR="$(gh pr create --base develop --head "${BRANCH}" \
              --title "chore(l10n): Weblate → develop" \
              --body "Automatisch: Locale-Dateien vom \`weblate\`-Branch nach \`develop\`." \
              | grep -oE '[0-9]+$')"
          fi

          # protect-develop: PR + required check «CI ok»
          gh pr merge "$PR" --auto --squash --delete-branch || true
          if gh pr view "$PR" --json state -q .state | grep -qx MERGED; then
            echo "PR #$PR bereits gemerged."
            exit 0
          fi

          echo "Warte auf CI-Checks für PR #$PR …"
          # Bis zu ~15 Min auf grüne Checks (Locales + CI ok)
          if ! gh pr checks "$PR" --watch --fail-fast --interval 15; then
            echo "::error::CI-Checks für PR #$PR fehlgeschlagen."
            exit 1
          fi

          if ! gh pr merge "$PR" --squash --delete-branch; then
            echo "::warning::PR #$PR erstellt, Merge fehlgeschlagen — bitte manuell mergen."
            exit 1
          fi
