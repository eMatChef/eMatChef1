name: Deploy Docs Prod (Droplet)

# Öffentliche Hilfe docs.ematchef.ch → /var/www/ematchef-docs-prod
# auf ematchef-api-prod (nicht App-Webroot, nicht Weblate-Droplet).

on:
  push:
    branches:
      - prod
    paths:
      - "user-docs/**"
      - "scripts/build-droplet-docs.sh"
      - ".github/workflows/deploy-docs-prod.yml"
  workflow_dispatch:

concurrency:
  group: deploy-docs-prod
  cancel-in-progress: true

jobs:
  deploy-docs-prod:
    name: Build and rsync docs to prod webroot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: user-docs/package-lock.json

      - name: Install docs dependencies
        run: npm ci
        working-directory: user-docs

      - name: Build docs
        working-directory: ${{ github.workspace }}
        env:
          EMATCHEF_REPO_ROOT: ${{ github.workspace }}
        run: bash scripts/build-droplet-docs.sh

      - name: Verify output
        run: |
          test -f deploy/droplet/prod/docs/index.html
          test -f deploy/droplet/prod/docs/robots.txt
          du -sh deploy/droplet/prod/docs

      - name: Rsync docs to droplet
        uses: burnett01/rsync-deployments@9.0.1
        with:
          switches: -avz --delete
          path: deploy/droplet/prod/docs/
          remote_path: ${{ secrets.PROD_DOCS_WEBROOT }}/
          remote_host: ${{ secrets.PROD_SSH_HOST }}
          remote_user: ${{ secrets.PROD_SSH_USER }}
          remote_key: ${{ secrets.PROD_SSH_KEY }}
          remote_port: ${{ secrets.PROD_SSH_PORT }}
