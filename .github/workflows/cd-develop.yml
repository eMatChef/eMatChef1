name: CD Develop

on:
  push:
    branches:
      - develop
  schedule:
    # Nachzieher wie eCamp: alle 30 Min, falls Push-CD ausfiel oder Server hinterherhinkt
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: cd-develop
  cancel-in-progress: true

jobs:
  deploy-develop:
    name: Deploy to develop server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEVELOP_SSH_HOST }}
          username: ${{ secrets.DEVELOP_SSH_USER }}
          key: ${{ secrets.DEVELOP_SSH_KEY }}
          port: ${{ secrets.DEVELOP_SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            # Server→GitHub Deploy-Key (Hetzner root; kein /home/root/…).
            GIT_DEPLOY_KEY=/root/.ssh/ematchef_deploy_develop_ed25519
            if [[ ! -f "$GIT_DEPLOY_KEY" ]]; then GIT_DEPLOY_KEY=/root/.ssh/ematchef_deploy_ed25519; fi
            if [[ ! -f "$GIT_DEPLOY_KEY" ]]; then echo "::error::Kein Git-Deploy-Key gefunden: $GIT_DEPLOY_KEY"; exit 1; fi
            echo "Using git deploy key: $GIT_DEPLOY_KEY"
            export EMATCHEF_GIT_SSH_IDENTITY="$GIT_DEPLOY_KEY"
            export GIT_SSH_COMMAND="ssh -i ${GIT_DEPLOY_KEY} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            cd "${{ secrets.DEVELOP_DEPLOY_PATH }}"
            DEPLOY_ROOT="${{ secrets.DEVELOP_DEPLOY_PATH }}"
            if [[ ! -w "${DEPLOY_ROOT}/.git/objects" ]]; then
              chown -R "$(id -u):$(id -g)" "${DEPLOY_ROOT}/.git" 2>/dev/null || \
              docker run --rm -u 0 -v "${DEPLOY_ROOT}/.git:/git" alpine:3.20 \
                sh -c "chown -R $(id -u):$(id -g) /git && chmod -R u+rwX /git"
            fi
            # Bootstrap: altes prod-update.sh auf dem Server macht ggf. noch `git fetch origin`
            # und scheitert, bevor reset das neue Skript holen kann.
            git fetch --no-tags origin "+refs/heads/develop:refs/remotes/origin/develop"
            LOCAL="$(git rev-parse HEAD)"
            REMOTE="$(git rev-parse origin/develop)"
            if [[ "$LOCAL" == "$REMOTE" ]]; then
              echo "Already at origin/develop ($LOCAL) — skip deploy."
              exit 0
            fi
            echo "Updating $LOCAL -> $REMOTE"
            git reset --hard origin/develop
            EMATCHEF_PROD_ROOT="${{ secrets.DEVELOP_DEPLOY_PATH }}" \
            EMATCHEF_GIT_BRANCH=develop \
            COMPOSE_PROJECT_NAME=ematchef-develop \
            ./deploy/prod-update.sh reset
