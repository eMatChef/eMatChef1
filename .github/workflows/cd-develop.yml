name: CD Develop

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: cd-develop
  cancel-in-progress: true

jobs:
  deploy-develop:
    name: Deploy to develop server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEVELOP_SSH_HOST }}
          username: ${{ secrets.DEVELOP_SSH_USER }}
          key: ${{ secrets.DEVELOP_SSH_KEY }}
          port: ${{ secrets.DEVELOP_SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            export EMATCHEF_GIT_SSH_IDENTITY="/home/${{ secrets.DEVELOP_SSH_USER }}/.ssh/ematchef_deploy_develop_ed25519"
            _git_ssh_id="$EMATCHEF_GIT_SSH_IDENTITY"
            export GIT_SSH_COMMAND="ssh -i ${_git_ssh_id} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            cd "${{ secrets.DEVELOP_DEPLOY_PATH }}"
            DEPLOY_ROOT="${{ secrets.DEVELOP_DEPLOY_PATH }}"
            if [[ -x "${DEPLOY_ROOT}/deploy/fix-git-permissions.sh" ]]; then
              EMATCHEF_PROD_ROOT="${DEPLOY_ROOT}" "${DEPLOY_ROOT}/deploy/fix-git-permissions.sh"
            else
              uid="$(id -u)" gid="$(id -g)"
              chown -R "${uid}:${gid}" "${DEPLOY_ROOT}/.git" 2>/dev/null || \
              docker run --rm -u 0 -v "${DEPLOY_ROOT}/.git:/git" alpine:3.20 \
                sh -c "chown -R ${uid}:${gid} /git && chmod -R u+rwX /git"
            fi
            # Bootstrap: altes prod-update.sh auf dem Server macht ggf. noch `git fetch origin`
            # und scheitert, bevor reset das neue Skript holen kann.
            git fetch --no-tags origin "+refs/heads/develop:refs/remotes/origin/develop"
            git reset --hard origin/develop
            EMATCHEF_PROD_ROOT="${{ secrets.DEVELOP_DEPLOY_PATH }}" \
            EMATCHEF_GIT_BRANCH=develop \
            COMPOSE_PROJECT_NAME=ematchef-develop \
            ./deploy/prod-update.sh reset
