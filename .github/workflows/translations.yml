name: Translations (Crowdin)

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Crowdin command to run"
        required: true
        default: "download"
        type: choice
        options:
          - upload-sources
          - download
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  crowdin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Crowdin CLI
        run: npm install -g @crowdin/cli

      - name: Upload source strings
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.command == 'upload-sources' }}
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: crowdin upload sources

      - name: Download translations
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.command == 'download') }}
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: crowdin download

      - name: Create Pull Request for translation updates
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.command == 'download') }}
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(i18n): update translations from Crowdin"
          branch: "chore/crowdin-translations"
          delete-branch: true
          title: "chore(i18n): update translations from Crowdin"
          body: |
            Automated translation sync from Crowdin.
          labels: |
            i18n
            automated
