# Nach Review und gruenen Checks: Kommentar /fast-forward auf dem Release-PR.
# Erlaubt: develop → staging und staging → prod.
# Kein separater Bot-Account: Merge per github.token (siehe docs/SETUP-GITHUB.md).
name: Fast forward (release)

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fast-forward-release
  cancel-in-progress: false

jobs:
  fast_forward:
    name: Fast-forward merge
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request && github.event.comment.body == '/fast-forward'

    steps:
      - name: Check permission (Core-Team)
        id: permission
        uses: actions-cool/check-user-permission@v2
        with:
          require: maintain
          username: ${{ github.event.comment.user.login }}

      - name: Comment on permission denied
        if: steps.permission.outputs.require-result != 'true'
        uses: thollander/actions-comment-pull-request@v3
        with:
          pr-number: ${{ github.event.issue.number }}
          message: |
            `/fast-forward` darf nur von Personen mit **Maintain**- oder **Admin**-Rolle in diesem Repository ausgeloest werden.

      - name: Exit if insufficient permission
        if: steps.permission.outputs.require-result != 'true'
        run: exit 1

      - name: Validate PR (staging ← develop oder prod ← staging)
        id: validate
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (pr.draft) {
              core.setFailed('Fast-forward nicht fuer Draft-PRs.');
              return;
            }
            const allowed = [
              { base: 'staging', head: 'develop' },
              { base: 'prod', head: 'staging' },
            ];
            const ok = allowed.some((p) => pr.base.ref === p.base && pr.head.ref === p.head);
            if (!ok) {
              core.setFailed(
                `Nur PRs **staging** <- **develop** oder **prod** <- **staging**. ` +
                `Dieser PR: **${pr.base.ref}** <- **${pr.head.ref}**.`
              );
              return;
            }
            if (pr.mergeable_state !== 'clean') {
              core.setFailed(
                `Kein sauberer Fast-forward (mergeable_state: **${pr.mergeable_state}**). ` +
                'Branche zusammengefuehrt / Konflikte geloest?'
              );
              return;
            }
            core.setOutput('base', pr.base.ref);
            core.setOutput('head', pr.head.ref);

      - name: Fast-forward merge
        uses: endre-spotlab/fast-forward-js-action@2.1
        with:
          GITHUB_TOKEN: ${{ github.token }}
          success_message: |
            Erfolg: **${{ steps.validate.outputs.base }}** wurde per Fast-forward auf **${{ steps.validate.outputs.head }}** gesetzt.

            ```bash
            git checkout ${{ steps.validate.outputs.base }} && git merge ${{ steps.validate.outputs.head }} --ff-only
            ```
          failure_message: 'Fast-forward fehlgeschlagen (Branch-Historie erlaubt kein FF).'
