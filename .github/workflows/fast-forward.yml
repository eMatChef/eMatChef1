# Release-Promotion: develop → staging und staging → prod.
# Der PR bleibt für Review und CI. Abgeschlossen wird er nur durch
# den Kommentar /fast-forward. Der Ziel-Ref wird per Fast-Forward
# auf den geprüften Head-SHA gesetzt. Kein Squash, kein Merge-Commit,
# kein Rebase, kein Force-Push.
name: Fast forward (release)

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: fast-forward-release
  cancel-in-progress: false

jobs:
  fast_forward:
    name: Fast-forward promotion
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request && github.event.comment.body == '/fast-forward'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Promote by fast-forward
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/release-fast-forward.mjs
