name: FTP Deploy Prod (Hostpoint)

on:
  push:
    branches:
      - prod
    paths:
      - "frontend/**"
      - "scripts/build-hostpoint-deploy-prod.sh"
      - "scripts/build-hostpoint-deploy.sh"
      - "scripts/hostpoint-spa.htaccess"
      - ".github/workflows/ftp-deploy-prod.yml"
  workflow_dispatch:

concurrency:
  group: ftp-deploy-prod
  cancel-in-progress: true

jobs:
  deploy-prod-hostpoint:
    name: Build and upload prod frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build prod hostpoint artifacts
        working-directory: ${{ github.workspace }}
        env:
          EMATCHEF_REPO_ROOT: ${{ github.workspace }}
        run: bash scripts/build-hostpoint-deploy-prod.sh

      - name: Verify prod hostpoint output (home + app)
        run: |
          test -f deploy/hostpoint/prod/home/index.html
          test -f deploy/hostpoint/prod/app/index.html
          du -sh deploy/hostpoint/prod/home deploy/hostpoint/prod/app

      - name: Upload prod home
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: deploy/hostpoint/prod/home/
          server-dir: ${{ secrets.FTP_PATH_MAIN_PROD }}
          # Entfernt auf dem Server alles, was nicht im aktuellen Build liegt (verhindert doppelte Alt-Dateien / Case-Duplikate).
          dangerous-clean-slate: true

      - name: Upload prod app
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: deploy/hostpoint/prod/app/
          server-dir: ${{ secrets.FTP_PATH_APP_PROD }}
          dangerous-clean-slate: true
