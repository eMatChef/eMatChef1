name: FTP Deploy Prod Marketing (Hostpoint)

# Nur Marketing (ematchef.ch) per FTP. App/QR/Devices → Prod-Droplet (Caddy/rsync).

on:
  push:
    branches:
      - prod
    paths:
      - "frontend/**"
      - "scripts/build-hostpoint-deploy-prod.sh"
      - "scripts/hostpoint-spa.htaccess"
      - ".github/workflows/ftp-deploy-prod.yml"
  workflow_dispatch:

concurrency:
  group: ftp-deploy-prod
  cancel-in-progress: true

jobs:
  deploy-prod-marketing-hostpoint:
    name: Build and upload prod marketing (home)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build prod hostpoint marketing
        working-directory: ${{ github.workspace }}
        env:
          EMATCHEF_REPO_ROOT: ${{ github.workspace }}
        run: bash scripts/build-hostpoint-deploy-prod.sh

      - name: Verify prod home output
        run: |
          test -f deploy/hostpoint/prod/home/index.html
          test -f deploy/hostpoint/prod/home/.htaccess
          du -sh deploy/hostpoint/prod/home

      - name: Upload prod home
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: deploy/hostpoint/prod/home/
          server-dir: ${{ secrets.FTP_PATH_MAIN_PROD }}
          dangerous-clean-slate: true
