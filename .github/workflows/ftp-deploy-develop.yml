name: FTP Deploy Develop (Hostpoint)

on:
  push:
    branches:
      - develop
    paths:
      - "frontend/**"
      - "scripts/build-hostpoint-deploy-dev.sh"
      - "scripts/hostpoint-spa.htaccess"
      - ".github/workflows/ftp-deploy-develop.yml"
  workflow_dispatch:

concurrency:
  group: ftp-deploy-develop
  cancel-in-progress: true

jobs:
  deploy-dev-hostpoint:
    name: Build and upload dev frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build dev hostpoint artifacts
        working-directory: ${{ github.workspace }}
        env:
          EMATCHEF_REPO_ROOT: ${{ github.workspace }}
        run: bash scripts/build-hostpoint-deploy-dev.sh

      - name: Verify dev hostpoint output (home + app)
        run: |
          test -f deploy/hostpoint/dev/home/index.html
          test -f deploy/hostpoint/dev/app/index.html
          du -sh deploy/hostpoint/dev/home deploy/hostpoint/dev/app

      - name: Upload dev home
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: deploy/hostpoint/dev/home/
          server-dir: ${{ secrets.FTP_PATH_MAIN_DEV }}
          # Entfernt auf dem Server alles, was nicht im aktuellen Build liegt (verhindert doppelte Alt-Dateien / Case-Duplikate).
          dangerous-clean-slate: true

      - name: Upload dev app
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: deploy/hostpoint/dev/app/
          server-dir: ${{ secrets.FTP_PATH_APP_DEV }}
          dangerous-clean-slate: true
