name: FTP Deploy Develop (Hostpoint)

on:
  push:
    branches:
      - develop
    paths:
      - "frontend/**"
      - "scripts/build-hostpoint-deploy-dev.sh"
      - "scripts/hostpoint-spa.htaccess"
      - ".github/workflows/ftp-deploy-develop.yml"
  workflow_dispatch:

concurrency:
  group: ftp-deploy-develop
  cancel-in-progress: true

jobs:
  deploy-dev-hostpoint:
    name: Build and upload dev frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build dev hostpoint artifacts
        run: bash scripts/build-hostpoint-deploy-dev.sh

      - name: Upload dev home
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: deploy/hostpoint/dev/home/
          server-dir: ${{ secrets.FTP_PATH_MAIN_DEV }}

      - name: Upload dev app
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: deploy/hostpoint/dev/app/
          server-dir: ${{ secrets.FTP_PATH_APP_DEV }}
