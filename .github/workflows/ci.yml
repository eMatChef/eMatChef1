name: CI

on:
  pull_request:
    branches:
      - develop
      - staging
      - prod
  push:
    branches:
      - develop
      - staging
      - prod
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      locales: ${{ steps.filter.outputs.locales }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            locales:
              - 'frontend/src/locales/**'
              - 'scripts/check-locales.sh'
              - '.github/workflows/ci.yml'

  locales:
    name: Locales
    needs: changes
    if: needs.changes.outputs.locales == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate locale JSON
        run: bash scripts/check-locales.sh

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint:ci

      - name: Unit tests
        run: npm test

      - name: Typecheck & build
        run: npm run build

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Validate composer files
        run: composer validate --strict --no-interaction

      - name: Install backend dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Unit tests
        run: ./vendor/bin/phpunit

      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  # Live-E2E (docs/E2E.md): auf Staging/Prod Pflicht. Auf Develop nur Signal —
  # sonst blockiert ein hängendes Develop den Merge, der den Droplet erst heilen soll.
  e2e:
    name: Playwright smoke
    needs: changes
    if: >
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.backend == 'true' ||
      github.event.pull_request.base.ref == 'staging' ||
      github.event.pull_request.base.ref == 'prod' ||
      github.ref_name == 'staging' ||
      github.ref_name == 'prod'
    continue-on-error: ${{ (github.event.pull_request.base.ref || github.ref_name) == 'develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          export E2E_BASE_URL="${E2E_BASE_URL:-https://dev.ematchef.ch}"
          npm run test:e2e

  # Branch protection: required check «CI ok»
  ci-ok:
    name: CI ok
    needs: [changes, locales, frontend, backend, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          set -euo pipefail
          locales="${{ needs.locales.result }}"
          front="${{ needs.frontend.result }}"
          back="${{ needs.backend.result }}"
          e2e="${{ needs.e2e.result }}"
          target="${{ github.event.pull_request.base.ref || github.ref_name }}"
          # Path-gefilterte Jobs: success | skipped = ok
          ok_optional() { [[ "$1" == "success" || "$1" == "skipped" ]]; }
          e2e_ok=1
          if [[ "$target" == "staging" || "$target" == "prod" ]]; then
            [[ "$e2e" == "success" ]] || e2e_ok=0
          fi
          if ok_optional "$locales" && ok_optional "$front" && ok_optional "$back" && [[ "$e2e_ok" == "1" ]]; then
            echo "CI ok (target=$target locales=$locales frontend=$front backend=$back e2e=$e2e)"
            exit 0
          fi
          echo "::error::CI failed (target=$target locales=$locales frontend=$front backend=$back e2e=$e2e)"
          exit 1
