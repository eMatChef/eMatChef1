# Smoke-E2E gegen die laufende Develop-/Prod-App (siehe docs/E2E.md).
# Noch nicht Teil von «CI ok» — erst stabilisieren.

name: E2E Smoke

on:
  pull_request:
    branches: [develop, prod]
  push:
    branches: [develop, prod]
  workflow_dispatch:

concurrency:
  group: e2e-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Vorerst soft: Secrets/Flakes sollen Merges nicht blockieren
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          export E2E_BASE_URL="${E2E_BASE_URL:-https://app.dev.ematchef.ch}"
          npm run test:e2e
