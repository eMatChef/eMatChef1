# HTTP nur Redirect → HTTPS (mit docker-compose.override + mkcert).
# Ersetzt default.conf, wenn https.conf aktiv ist.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;
    return 302 https://ematchef.test$request_uri;
}

server {
    listen 80;
    server_name ematchef.test app.ematchef.test qr.ematchef.test devices.ematchef.test;
    return 301 https://$host$request_uri;
}
