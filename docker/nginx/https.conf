# Lokales HTTPS für *.ematchef.test (Kamera, Secure Cookies).
# Zertifikate: scripts/generate-local-https-certs.sh
# Aktivierung: docker-compose.override.https.example.yml → docker-compose.override.yml

server {
    listen 443 ssl;
    http2 on;
    server_name ematchef.test app.ematchef.test qr.ematchef.test devices.ematchef.test;

    ssl_certificate /etc/nginx/certs/ematchef.test.pem;
    ssl_certificate_key /etc/nginx/certs/ematchef.test-key.pem;

    client_max_body_size 32m;

    location /api {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_hide_header Host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
