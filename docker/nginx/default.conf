# Nur bei WebSocket (Vite HMR) Connection: upgrade; sonst normale HTTP/1.1 (sonst 502 auf GET /)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;
    return 302 http://ematchef.test$request_uri;
}

server {
    listen 80;
    # Lokal wie Produktion: Apex + Subdomains auf eigener Basisdomain.
    server_name ematchef.test app.ematchef.test qr.ematchef.test devices.ematchef.test;

    client_max_body_size 32m;

    location /api {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        # PHP Built-in Server liefert fälschlich "Host" im Response — kein gültiger
        # Response-Header; Browser/Clients sollten ihn nicht sehen.
        proxy_hide_header Host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_hide_header Host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
