# Nur bei WebSocket (Vite HMR) Connection: upgrade; sonst normale HTTP/1.1 (sonst 502 auf GET /)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # app.* / qr.* wie in Produktion; Browser lösen *.localhost auf 127.0.0.1 auf
    server_name localhost app.localhost qr.localhost 127.0.0.1;

    client_max_body_size 32m;

    location /api {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
