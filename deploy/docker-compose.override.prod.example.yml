# Production-Override für den API-Server (DigitalOcean o. Ä.).
#
# Nutzung auf dem Server:
#   cp deploy/docker-compose.override.prod.example.yml docker-compose.override.yml
#   bash deploy/init-prod-env.sh
#   (Alternative: cp deploy/docker-compose.prod.env.example .env && nano .env)
#
# Erster Start mit neuem DB-Passwort: Volume ggf. leeren, sonst Passwort zur bestehenden DB passend wählen:
#   docker compose -p ematchef-prod down -v   # löscht postgres_data – nur wenn Daten weg dürfen!
#
# Dann (ohne --build = schnell; Code per Volume):
#   export HOST_UID=$(id -u) HOST_GID=$(id -g)
#   docker compose -p ematchef-prod up -d db backend
# Bei Dockerfile-Änderung: EMATCHEF_COMPOSE_BUILD=1 docker compose -p ematchef-prod up -d --build db backend

services:
  db:
    # Kein Host-Port: DB nur im Docker-Netz (Backend → db:5432). Kein Konflikt mit OS-Postgres auf :5432.
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  backend:
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: "postgresql://mvuser:${POSTGRES_PASSWORD}@db:5432/mvdb?serverVersion=16&charset=utf8"
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      APP_FRONTEND_URL: "https://app.ematchef.ch"
      APP_PUBLIC_QR_URL: "https://qr.ematchef.ch"
      # Nur eure echten HTTPS-Origins (Frontend auf Hostpoint)
      CORS_ALLOW_ORIGIN: '^https://(app\.ematchef\.ch|ematchef\.ch|www\.ematchef\.ch)$'
      # Hostpoint SMTP (Control Panel): MAILER_DSN in .env setzen, z. B.:
      # smtp://MAILBOX%40ematchef.ch:PASSWORT@smtp.mail.hostpoint.ch:587
      # (Sonderzeichen in User/Pass URL-encoden, z. B. @ → %40)
      MAILER_DSN: "${MAILER_DSN:-null://null}"
      MAILER_FROM: "${MAILER_FROM:-noreply@ematchef.ch}"
      # Cloudflare Turnstile (nur Registrierung /api/auth/register): Secret in .env, nie committen
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"
      TURNSTILE_SKIP_VERIFY: "${TURNSTILE_SKIP_VERIFY:-0}"
