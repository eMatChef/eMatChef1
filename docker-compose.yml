# Damit vendor/ und node_modules/ auf dem Host nicht root gehören:
#   export HOST_UID=$(id -u) HOST_GID=$(id -g)
# oder in .env: HOST_UID=1000 und HOST_GID=1000 (Compose lädt .env automatisch)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mvdb
      POSTGRES_USER: mvuser
      POSTGRES_PASSWORD: mvpass
      TZ: UTC
      PGTZ: UTC
    # Kein Host-Port: vermeidet Konflikt mit lokalem/OS-Postgres (5432) und Prod-Droplet.
    # Für Tools auf dem Host: docker-compose.override.local-ports.example.yml → docker-compose.override.yml
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mvuser -d mvdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    ports:
      - "8082:8080"
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db

  backend:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: "postgresql://mvuser:mvpass@db:5432/mvdb?serverVersion=16&charset=utf8"
      JWT_PASSPHRASE: "your-secret-passphrase-change-in-production"
      APP_ENV: dev
      APP_FRONTEND_URL: "http://app.localhost"
      # Öffentliche QR-URLs (/i/m/, /i/b/) – muss mit VITE_QR_PUBLIC_HOST / Nginx qr.* übereinstimmen
      APP_PUBLIC_QR_URL: "http://qr.localhost"
      CORS_ALLOW_ORIGIN: '^https?://(app\.localhost|qr\.localhost|localhost|127\.0\.0\.1)(:[0-9]+)?$'
      # Lokal Registrierung ohne Turnstile testen: 1 (Produktion nie)
      TURNSTILE_SKIP_VERIFY: "${TURNSTILE_SKIP_VERIFY:-0}"
      MAILER_FROM: "${MAILER_FROM:-support@ematchef.ch}"
      MAILER_DSN: "${MAILER_DSN:-null://null}"
      PHP_OPCACHE_ENABLE: "1"
      PHP_OPCACHE_MEMORY_CONSUMPTION: "256"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    # Entrypoint: Migrationen + JWT-Keys (siehe backend/docker-entrypoint.sh)
    entrypoint: ["/var/www/html/docker-entrypoint.sh"]
    command: ["php", "-S", "0.0.0.0:8081", "-t", "public"]

  frontend:
    # Root nur für Entrypoint (chown node_modules-Volume), danach su-exec auf HOST_UID
    user: "0:0"
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      HOST_UID: "${HOST_UID:-1000}"
      HOST_GID: "${HOST_GID:-1000}"
      # Gleiche Origin wie aktueller Host (app.localhost / qr.localhost) → /api über Nginx
      VITE_RELATIVE_API: "true"
      # Vite-Proxy im Container: localhost:8081 zeigt auf den Container selbst → Backend per Service-Name
      VITE_API_PROXY_TARGET: "http://backend:8081"
      VITE_QR_PUBLIC_HOST: qr.localhost
      VITE_APP_ORIGIN: http://app.localhost
      VITE_MAIN_SITE_ORIGIN: http://app.localhost
      HMR_CLIENT_PORT: "80"
    command: npm run dev -- --host 0.0.0.0

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  backend_vendor:
  frontend_node_modules:
