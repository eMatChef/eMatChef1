services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mvdb
      POSTGRES_USER: mvuser
      POSTGRES_PASSWORD: mvpass
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mvuser -d mvdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    ports:
      - "8082:8080"
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: "postgresql://mvuser:mvpass@db:5432/mvdb?serverVersion=16&charset=utf8"
      JWT_PASSPHRASE: "your-secret-passphrase-change-in-production"
      APP_ENV: dev
      APP_FRONTEND_URL: "http://localhost:5173"
      MAILER_FROM: "${MAILER_FROM:-support@ematchef.ch}"
      MAILER_DSN: "${MAILER_DSN:-null://null}"
      PHP_OPCACHE_ENABLE: "1"
      PHP_OPCACHE_MEMORY_CONSUMPTION: "256"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    command: php -S 0.0.0.0:8081 -t public

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_BASE=http://localhost:8081
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  backend_vendor:
  frontend_node_modules:
