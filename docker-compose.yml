# Damit vendor/ und node_modules/ auf dem Host nicht root gehören:
#   export HOST_UID=$(id -u) HOST_GID=$(id -g)
# oder in .env: HOST_UID=1000 und HOST_GID=1000 (Compose lädt .env automatisch)
#
# Droplet / CI: CORS, Cookies, JWT usw. dürfen NICHT nur in dieser Datei stehen —
# `git reset --hard` würde sie sonst bei jedem Deploy überschreiben. Stattdessen im
# Repo-Root eine .env anlegen (gitignored) oder docker-compose.override.yml nutzen
# (siehe deploy/SERVER-UPDATE.md und deploy/develop-droplet.env.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mvdb
      POSTGRES_USER: mvuser
      POSTGRES_PASSWORD: mvpass
      TZ: UTC
      PGTZ: UTC
    # Kein Host-Port: vermeidet Konflikt mit lokalem/OS-Postgres (5432) und Prod-Droplet.
    # Für Tools auf dem Host: docker-compose.override.local-ports.example.yml → docker-compose.override.yml
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mvuser -d mvdb"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 90s

  adminer:
    image: adminer:latest
    ports:
      - "8082:8080"
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db

  backend:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: "postgresql://mvuser:mvpass@db:5432/mvdb?serverVersion=16&charset=utf8"
      # Gleiche Passphrase wie bei lexik:jwt-Keys; auf dem Droplet per Root-.env setzen
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-your-secret-passphrase-change-in-production}
      APP_ENV: dev
      # Überschreibbar per Repo-Root-.env (Droplet), sonst lokale *.ematchef.test-Werte
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://app.ematchef.test}
      # Öffentliche QR-URLs (/i/m/…/b/…, /i/a/, /i/w/) – muss mit VITE_QR_PUBLIC_HOST / Nginx qr.* übereinstimmen
      APP_PUBLIC_QR_URL: ${APP_PUBLIC_QR_URL:-http://qr.ematchef.test}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-.ematchef.test}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-0}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-^https?://(ematchef\.test|app\.ematchef\.test|qr\.ematchef\.test|devices\.ematchef\.test|localhost|127\.0\.0\.1)(:[0-9]+)?$}
      # Lokal Registrierung ohne Turnstile testen: 1 (Produktion nie)
      TURNSTILE_SKIP_VERIFY: "${TURNSTILE_SKIP_VERIFY:-0}"
      # E-Mail: MAILER_DSN in backend/.env.local (siehe backend/.env.local.example).
      # MAILER_DSN/MAILER_FROM nicht in environment setzen — sonst überschreibt Container-Env die .env.local.
      PHP_OPCACHE_ENABLE: "1"
      PHP_OPCACHE_MEMORY_CONSUMPTION: "256"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    # Entrypoint: Migrationen + JWT-Keys (siehe backend/docker-entrypoint.sh)
    entrypoint: ["/var/www/html/docker-entrypoint.sh"]
    command: ["php", "-S", "0.0.0.0:8081", "-t", "public", "public/router.php"]

  frontend:
    # Root nur für Entrypoint (chown node_modules-Volume), danach su-exec auf HOST_UID
    user: "0:0"
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      HOST_UID: "${HOST_UID:-1000}"
      HOST_GID: "${HOST_GID:-1000}"
      # Gleiche Origin wie aktueller Host (app.ematchef.test / qr.ematchef.test) → /api über Nginx
      VITE_RELATIVE_API: "true"
      # Vite-Proxy im Container: localhost:8081 zeigt auf den Container selbst → Backend per Service-Name
      VITE_API_PROXY_TARGET: "http://backend:8081"
      VITE_QR_PUBLIC_HOST: qr.ematchef.test
      VITE_APP_ORIGIN: http://app.ematchef.test
      VITE_MAIN_SITE_ORIGIN: http://ematchef.test
      VITE_DEVICES_HOST: devices.ematchef.test
      HMR_CLIENT_PORT: "80"
    command: npm run dev -- --host 0.0.0.0

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  backend_vendor:
  frontend_node_modules:
