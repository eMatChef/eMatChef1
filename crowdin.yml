pull_request_title: "chore(i18n): Update translations from Crowdin"
commit_message: "chore(i18n): Update %language% translations from Crowdin"

project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

# Crowdin „Version / Branch“ im Projekt (nicht Git). Nur relevant, wenn ihr Branches in Crowdin nutzt;
# dann sollte dort ein Branch `main` existieren. Ohne Crowdin-Branches: diese Zeile wieder entfernen.
branch: main

files:
  - source: frontend/src/locales/de.json
    translation: frontend/src/locales/%locale%.json
    # Wenn Crowdin z. B. en-US liefert, Dateiname soll trotzdem en.json bleiben (vue-i18n).
    languages_mapping:
      locale:
        en-US: en
        fr-FR: fr
        it-IT: it
