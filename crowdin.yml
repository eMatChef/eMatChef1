# Grundsprache ist Deutsch: die `source`-Dateien liefern die Referenz-Strings in Crowdin.
# Im Crowdin-Webprojekt unter Settings → Languages muss die Quellsprache „German“ sein,
# damit die UI zu diesen Uploads passt.

pull_request_title: "chore(i18n): Update translations from Crowdin"
commit_message: "chore(i18n): Update %language% translations from Crowdin"

project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

# Wenn ihr Crowdin-Branches nutzt:
branch: prod

files:
  - source: frontend/src/locales/de.json
    translation: frontend/src/locales/%locale%.json
  # Pfadi/Cevi: nur Abweichungen zu de.json (vue-i18n-Fallback de-pfadi|de-cevi → de).
  # Ziel-Locales (%locale%-pfadi|cevi) ebenfalls nur Deltas zur Basis-Locale.
  - source: frontend/src/locales/de-pfadi.json
    translation: frontend/src/locales/%locale%-pfadi.json
  - source: frontend/src/locales/de-cevi.json
    translation: frontend/src/locales/%locale%-cevi.json
  - source: frontend/src/locales/ch-rm.json
    translation: frontend/src/locales/%locale%-ch-rm.json