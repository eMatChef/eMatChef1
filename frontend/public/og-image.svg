<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="eMatChef">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#064e3b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <circle cx="1040" cy="120" r="180" fill="#ffffff" fill-opacity="0.06"/>
  <circle cx="180" cy="560" r="220" fill="#ffffff" fill-opacity="0.05"/>

  <g transform="translate(96 145)">
    <g filter="url(#shadow)">
      <rect width="120" height="120" rx="28" fill="#10b981" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
      <text x="60" y="78" text-anchor="middle" fill="#ffffff" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.06em">EMC</text>
    </g>

    <text x="156" y="58" fill="#ffffff" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-0.03em">eMatChef</text>
    <text x="156" y="112" fill="#ecfdf5" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="34" font-weight="600">Material im Griff, Team im Blick</text>
    <text x="156" y="158" fill="#d1fae5" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">Materialverwaltung f&#252;r Vereine mit Aktivit&#228;ten/Anl&#228;sse</text>
  </g>

  <g transform="translate(96 430)">
    <rect x="0" y="0" width="210" height="52" rx="26" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="24" y="34" fill="#ffffff" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">ematchef.ch</text>

    <rect x="230" y="0" width="340" height="52" rx="26" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="254" y="34" fill="#ffffff" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Im Browser ohne Installation</text>
  </g>
